version: '3.8'

services:
  # 1. MongoDB database used by the FastAPI repositories
  db:
    image: mongo:7
    container_name: repomind_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/repomind | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - repomind_net

  # 2. Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: repomind_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - repomind_net

  # 3. Python FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: repomind_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://db:27017
      - DATABASE_NAME=repomind
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_IN_MEMORY=False
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REPOS_CACHE_DIR=/app/cache/repos
    volumes:
      - repos_cache:/app/cache/repos
    networks:
      - repomind_net

  # 4. Next.js 15 Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: repomind_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - repomind_net

volumes:
  mongo_data:
  qdrant_data:
  repos_cache:

networks:
  repomind_net:
    driver: bridge
